name: Rust CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check
      - name: Tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
