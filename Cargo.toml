[package]
name = "sentinel-api"
version = "0.1.0"
edition = "2024"
description = "A Rust reverse-proxy API gateway with per-client token authentication and explicit allowlist authorization"
license = "MIT"

[dependencies]
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
